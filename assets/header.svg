<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Hayati Öztürk</title>
  <desc id="d">Hayati Öztürk. Co-Founder and CTO at NEXNEXUS, game designer at BlackFlagBytes. Enterprise systems, cross-platform tools and games.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e131a"/>
      <stop offset="1" stop-color="#172230"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#6f8296" opacity="0.28"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect x="640" y="0" width="560" height="300" fill="url(#fade)"/></mask>
  </defs>
  <rect x="1" y="1" width="1198" height="298" rx="22" fill="url(#bg)" stroke="#2a3644" stroke-width="2"/>
  <rect x="640" y="14" width="546" height="272" fill="url(#dots)" mask="url(#m)"/>

  <rect x="72" y="74" width="44" height="5" rx="2.5" fill="#3ccf7a"/>
  <text x="72" y="112" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#8fa6b8" textLength="720" lengthAdjust="spacing">CO-FOUNDER &amp; CTO, NEXNEXUS  ·  GAME DESIGNER, BLACKFLAGBYTES</text>
  <text x="68" y="186" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="74" font-weight="700" fill="#f3f1ea" letter-spacing="-1.5">Hayati Öztürk</text>
  <text x="72" y="232" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#b9c8d3">Enterprise systems, cross-platform tools and games.</text>
  <text x="72" y="264" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#8fa6b8">Software that stays small, fast and on your own machine.</text>

  <!-- three tiles: the open-source tools -->
